<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resource - Classroom Resources</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B5CF6'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial,sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3EJP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<div class="main">
  <div class="topbar">
    <a class="rail-brand" href="index.html" style="border:0;padding:0;background:none">
      <span class="rail-mark">JP</span>
      <span>
        <span class="rail-name">Classroom</span>
        <span class="rail-sub">Resources</span>
      </span>
    </a>
    <span class="topbar-spacer"></span>
    <a class="tbtn" href="index.html">&larr; Back</a>
    <button class="tbtn" id="reloadBtn" type="button">Restart</button>
    <button class="tbtn" id="fullscreenBtn" type="button">Fullscreen</button>
  </div>

  <div class="inner">
    <div class="playhead">
      <h1 id="moduleTitle">Loading</h1>
      <span class="spacer"></span>
      <span id="moduleMeta"></span>
    </div>

    <div class="notice hidden" id="notice" role="status"></div>

    <div class="stage" id="stage" style="margin-top:14px">
      <div class="empty">Loading...</div>
    </div>

    <p class="muted" style="margin-top:14px;font-size:.84rem">
      Click inside the frame first if the arrow keys are not reaching the game.
      Press <strong>`</strong> to return to your assignment.
    </p>

    <section id="discussion" class="hidden" style="margin-top:44px">
      <div class="row-head"><span class="row-title">Discussion</span></div>
      <form id="commentForm" style="display:flex;flex-direction:column;gap:10px;max-width:640px;margin-bottom:18px">
        <input id="commentName" type="text" maxlength="32" placeholder="Name (optional)" autocomplete="off"
               style="padding:10px 13px;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)">
        <textarea id="commentText" maxlength="500" rows="3" required placeholder="Add a comment..."
               style="padding:11px 13px;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);resize:vertical"></textarea>
        <div style="display:flex;gap:12px;align-items:center">
          <button class="btn" type="submit">Post</button>
          <span class="muted" id="commentStatus" style="font-size:.82rem"></span>
        </div>
      </form>
      <div id="commentList"></div>
    </section>

    <div class="footer">
      <span>Classroom Resources</span>
      <span><a href="legal.html">Notices &amp; takedown</a> &middot; <a href="index.html">Home</a></span>
    </div>
  </div>
</div>

<script type="module">
  import { initPlayer } from "./assets/js/player.js";
  import { initPanic } from "./assets/js/panic.js";
  import { restoreCloak } from "./assets/js/cloak.js";
  import { initComments } from "./assets/js/comments.js";

  restoreCloak();
  initPanic();
  initPlayer();
  initComments(new URL(location.href).searchParams.get("id"));
</script>
</body>
</html>
